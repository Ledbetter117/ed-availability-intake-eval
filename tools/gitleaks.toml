title = "Default Gitleaks rules with reviewed exact EDi false-positive exceptions"

[release_review]
reviewed_on = "2026-11-03"
expires_on = "2027-02-01"
scope = "Exact extracted value AND exact historical file path; no whole-file or commit exemption"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Three exact reviewed SHA-256 values in the release review receipt: local-auth example, scanner wrapper, scanner tests"
condition = "AND"
regexTarget = "secret"
paths = ['''^\.public-release-review\.json$''']
regexes = [
  '''^418d8ea3c6dd5c16ac3802571d143749f802a5b94a4a978973a6aaf207aa9d10$''',
  '''^7a023cf28e0ded97c8b83775fb773f995a21c77fa31b2609eb4940eb9fe4bd79$''',
  '''^145f76faa92e5b450380d8698d45fa7def6f67decda5949d8b481cfa0e671ea5$''',
]

[[rules.allowlists]]
description = "Exact synthetic credential used by the historical r72 redaction regression"
condition = "AND"
regexTarget = "secret"
paths = ['''^tests/test_r72\.py$''']
regexes = ['''^sk-test-SECRET-0123456789$''']
