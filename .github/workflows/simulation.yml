name: Simulation study checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  simulation-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned simulation dependencies
        run: 'python -m pip install --only-binary=:all: -r requirements.txt'
      - name: Test strict scorer controls
        run: python -B -X utf8 simulation/test_simulation.py
      - name: Verify frozen inputs and replay all published observations
        run: >-
          python -B -X utf8 -c "import json; from pathlib import Path;
          from simulation.score_simulation import evaluate;
          root = Path('simulation').resolve();
          actual = evaluate(root, root / 'results/OBSERVATIONS.json');
          expected = json.loads((root / 'results/SCORES.json').read_text(encoding='utf-8'));
          assert actual == expected, 'Published observation replay differs';
          assert actual['observed'] == actual['scheduled'] == 36;
          print('PASS: frozen inputs verified; all 36 actual observations reproduce published scores')"
  simulation-report-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: -r requirements-audit.txt'
      - run: python -m pip_audit -r simulation/requirements-report.txt
