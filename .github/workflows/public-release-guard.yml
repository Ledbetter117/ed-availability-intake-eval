name: Public release guard
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 1'
permissions:
  contents: read
jobs:
  release-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install version-pinned guard parsers
        run: python -m pip install -r requirements-guard.txt
      - name: Prove deliberately unsafe fixtures fail
        run: python -B -m unittest discover -s tools -p test_public_release_guard.py
      - name: Prove scanner diagnostic errors cannot pass
        run: python -B -m unittest discover -s tools -p test_scan_secret_history.py
      - name: Inspect exact commit and substantive-review binding
        run: python -B tools/public_release_guard.py
      - name: Verify and run full-history secret scanner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          python -B tools/scan_secret_history.py . --gitleaks "$RUNNER_TEMP/gitleaks" --config tools/gitleaks.toml --out "$RUNNER_TEMP/secret-history.json" --expected-head "$(git rev-parse HEAD)"
